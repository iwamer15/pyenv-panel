name: Build Windows EXE

# 目的:
#   - main への push / PR、および手動実行のたびに windows-latest ランナーで
#     PyInstallerビルドが通ることを検証する（動作確認用のビルド成果物も添付）。
#   - "v*.*.*" 形式のタグをpushすると、ビルド後に GitHub Releases を作成し
#     PyEnvPanel.exe を自動添付する。Windows端末側はこのReleaseページの
#     固定リンクからexeをダウンロードできる。
#
# 使い方:
#   git tag v0.1.0
#   git push origin v0.1.0

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: pyinstaller pyenv_panel.spec --noconfirm --clean

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyEnvPanel-exe
          path: dist/PyEnvPanel.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: PyEnvPanel-exe
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PyEnvPanel.exe
          generate_release_notes: true
